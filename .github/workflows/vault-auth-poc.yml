name: Build and publish Vault authentication POC

on:
  push:
    branches: [master, main]
    paths:
      - 'vault-auth-poc/**'
      - '.github/workflows/vault-auth-poc.yml'
  pull_request:
    paths:
      - 'vault-auth-poc/**'
      - '.github/workflows/vault-auth-poc.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set lowercase image owner
        id: image
        run: echo "owner=$(echo ${GITHUB_REPOSITORY_OWNER} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (PR) or build and push
        uses: docker/build-push-action@v6
        with:
          context: ./vault-auth-poc/app
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/vault-auth-demo:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/vault-auth-demo:latest
