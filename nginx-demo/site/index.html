<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A local Jenkins CI/CD demonstration served by Nginx.">
  <title>Local CI/CD Demo</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center;
           background: radial-gradient(circle at top, #183453, #0d1117 58%); color: #f0f6fc; }
    main { width: min(680px, calc(100% - 40px)); box-sizing: border-box; padding: 42px;
           border: 1px solid #34475f; border-radius: 22px; background: #111c2b;
           box-shadow: 0 24px 70px #0008; }
    .eyebrow { color: #79c0ff; font-size: .75rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 15px 0; font-size: clamp(2rem, 6vw, 3.2rem); }
    p { color: #aab8c8; line-height: 1.8; }
    .status { display: inline-flex; gap: 9px; align-items: center; margin-top: 12px;
              padding: 9px 13px; border: 1px solid #286644; border-radius: 999px;
              color: #7ee787; background: #123326; font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; }
    code { color: #9ed0ff; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Local homelab · CI/CD</span>
    <h1>Hello from Nginx.</h1>
    <p>This static website is delivered by a Jenkins pipeline. Push a change to Git, let Jenkins validate and deploy it, then refresh this page.</p>
    <div class="status"><span class="dot"></span> Deployment served successfully</div>
    <p>Release: <code>1.0.1</code></p>
  </main>
</body>
</html>
