apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-demo-app
  namespace: demo
spec:
  ingressClassName: traefik
  rules:
    - host: app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault-demo-app
                port:
                  number: 80
